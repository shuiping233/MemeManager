name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 文件系统发布：自包含（自带 .NET 运行时）exe 文件夹，压缩为带 -runtime 后缀的 zip
  publish-zip-runtime:
    runs-on: windows-latest
    env:
      PUBLISH_DIR: ${{ github.workspace }}\publish-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (FileSystem, Self-Contained)
        run: dotnet publish MemeManager.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64 -p:SelfContained=true -p:AppVersion=${{ github.ref_name }} -o "$env:PUBLISH_DIR"

      - name: Compress publish output
        run: Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "MemeManager-win-x64-runtime-${{ github.ref_name }}.zip" -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemeManager-win-x64-runtime-zip
          path: MemeManager-win-x64-runtime-${{ github.ref_name }}.zip

  # 文件系统发布：依赖系统运行时（Framework-Dependent），压缩为不带后缀的 zip
  publish-zip-fd:
    runs-on: windows-latest
    env:
      PUBLISH_DIR: ${{ github.workspace }}\publish-fd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (FileSystem, Framework-Dependent)
        run: dotnet publish MemeManager.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64 -p:SelfContained=false -p:AppVersion=${{ github.ref_name }} -o "$env:PUBLISH_DIR"

      - name: Compress publish output
        run: Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "MemeManager-win-x64-${{ github.ref_name }}.zip" -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemeManager-win-x64-zip
          path: MemeManager-win-x64-${{ github.ref_name }}.zip

  # 创建 GitHub Release 并附上两个 zip 产物
  release:
    needs: [publish-zip-runtime, publish-zip-fd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                { "title": "## 🚀 Features", "labels": ["feat"] },
                { "title": "## 🐛 Fixes", "labels": ["fix", "bugfix"] },
                { "title": "## ♻️ Refactor", "labels": ["refactor"] },
                { "title": "## 📝 Docs", "labels": ["docs"] },
                { "title": "## 🔧 Chore", "labels": ["chore"] },
                { "title": "## Other", "labels": [] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|bugfix|perf|refactor|revert|style|test)(\\([\\w\\-\\.]+\\))?(!)?: (.+)",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
          files: |
            artifacts/MemeManager-win-x64-runtime-zip/MemeManager-win-x64-runtime-${{ github.ref_name }}.zip
            artifacts/MemeManager-win-x64-zip/MemeManager-win-x64-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

