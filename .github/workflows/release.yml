name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 文件系统发布：自包含（自带 .NET 运行时）exe 文件夹，压缩为带 -runtime 后缀的 zip
  publish-zip-runtime:
    runs-on: windows-latest
    env:
      PUBLISH_DIR: ${{ github.workspace }}\publish-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (FileSystem, Self-Contained)
        run: dotnet publish ./MemeManager/MemeManager.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64 -p:SelfContained=true -p:AppVersion=${{ github.ref_name }} -o "$env:PUBLISH_DIR"

      - name: Compress publish output
        run: Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "MemeManager-win-x64-runtime-${{ github.ref_name }}.zip" -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemeManager-win-x64-runtime-zip
          path: MemeManager-win-x64-runtime-${{ github.ref_name }}.zip

  # 文件系统发布：依赖系统运行时（Framework-Dependent），压缩为不带后缀的 zip
  publish-zip-fd:
    runs-on: windows-latest
    env:
      PUBLISH_DIR: ${{ github.workspace }}\publish-fd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (FileSystem, Framework-Dependent)
        run: dotnet publish ./MemeManager/MemeManager.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64 -p:SelfContained=false -p:AppVersion=${{ github.ref_name }} -o "$env:PUBLISH_DIR"

      - name: Compress publish output
        run: Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "MemeManager-win-x64-${{ github.ref_name }}.zip" -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemeManager-win-x64-zip
          path: MemeManager-win-x64-${{ github.ref_name }}.zip

  # 创建 GitHub Release 并附上 zip + msix 产物
  release:
    needs: [publish-zip-runtime, publish-zip-fd, pack-msix-sideload, pack-msix-store]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                { "title": "## 🚀 Features", "labels": ["feat"] },
                { "title": "## 🐛 Fixes", "labels": ["fix", "bugfix"] },
                { "title": "## ♻️ Refactor", "labels": ["refactor"] },
                { "title": "## 📝 Docs", "labels": ["docs"] },
                { "title": "## 🔧 Chore", "labels": ["chore"] },
                { "title": "## Other", "labels": [] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|bugfix|perf|refactor|revert|style|test)(\\([\\w\\-\\.]+\\))?(!)?: (.+)",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
          files: |
            artifacts/MemeManager-win-x64-runtime-zip/MemeManager-win-x64-runtime-${{ github.ref_name }}.zip
            artifacts/MemeManager-win-x64-zip/MemeManager-win-x64-${{ github.ref_name }}.zip
            artifacts/MemeManager-win-x64-msix-sideload/*.msix
            artifacts/MemeManager-win-x64-msix-sideload/*.cer
            artifacts/MemeManager-win-x64-msix-store/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 同步发布到 CNB（GitHub 下载不便，CNB 面向国内用户）。
      # 上传 zip×2 + 旁加载签名 msix + cer；Store 未签名 msix 对普通用户无意义，不传。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_BODY: ${{ steps.build_changelog.outputs.changelog }}
        run: |
          assets=()
          for p in artifacts/MemeManager-win-x64-runtime-zip/*.zip \
                   artifacts/MemeManager-win-x64-zip/*.zip \
                   artifacts/MemeManager-win-x64-msix-sideload/*.msix \
                   artifacts/MemeManager-win-x64-msix-sideload/*.cer; do
            [ -f "$p" ] && assets+=("$p")
          done
          echo "待上传附件: ${#assets[@]} 个"
          for a in "${assets[@]}"; do echo "  - $a"; done
          args=(--repo "shuiping233/MemeManager" --tag "${{ github.ref_name }}" --name "MemeManager ${{ github.ref_name }}" --body "$RELEASE_BODY")
          for a in "${assets[@]}"; do args+=(--asset "$a"); done
          python scripts/publish_cnb.py "${args[@]}"

  # MSIX 打包·旁加载轨：用自签名证书签名（仓库 secret MSIX_PFX_BASE64 / MSIX_PFX_PASSWORD），
  # 附带导出的 .cer 供安装者先安装到“受信任的根证书颁发机构”。
  pack-msix-sideload:
    runs-on: windows-latest
    env:
      MSIX_DIR: ${{ github.workspace }}\msix-sideload
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Decode and import signing certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:MSIX_PFX_BASE64)
          $pfx = "$env:RUNNER_TEMP\MemeManager-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $sec = ConvertTo-SecureString $env:MSIX_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec -Exportable
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}

      - name: Compute AppxPackageVersion (v1.2.3 -> 1.2.3.0)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if (($ver -split '\.').Count -lt 4) { $ver += '.0' }
          "APPX_VERSION=$ver" >> $env:GITHUB_ENV

      # 覆盖 Package.appxmanifest 的 Identity Version 为 tag 版本：
      # 本打包链路（Microsoft.Windows.SDK.BuildTools.MSIX NuGet targets）不消费 AppxPackageVersion，
      # msix 文件名与包版本均取自 manifest 的 Identity Version（源文件写死 1.0.0.0）。
      # 正则只匹配 <Identity> 标签，避免误伤 MinVersion 等其它 Version 属性；替换失败直接抛错。
      - name: Set manifest Identity Version
        shell: pwsh
        run: |
          $manifest = 'MemeManager\Package.appxmanifest'
          $content = Get-Content $manifest -Raw
          $new = $content -replace '(<Identity[^>]*?Version=")[^"]*(")', "`${1}$env:APPX_VERSION`${2}"
          if ($new -eq $content) { throw "未找到 Package.appxmanifest 的 Identity Version，替换失败" }
          Set-Content -Path $manifest -Value $new -NoNewline -Encoding utf8BOM
          Write-Host "已设置 manifest Identity Version = $env:APPX_VERSION"

      # 注意：不用 PackageCertificateKeyFile + Password（WinAppSDK 2.3.1 打包 targets 的 manifest
      # 生成任务不传密码，会 APPX0105 失败并回退到证书存储里同名的旧证书），
      # 改为「证书导入 CurrentUser\My + PackageCertificateThumbprint」，指纹精确指向我们的固定证书。
      - name: Publish signed MSIX (sideload)
        shell: pwsh
        run: dotnet publish ./MemeManager/MemeManager.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64-msix -p:SelfContained=false -p:AppVersion=${{ github.ref_name }} -p:AppxPackageVersion=$env:APPX_VERSION -p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT

      - name: Collect msix and export cer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:MSIX_DIR" | Out-Null
          # 先完整枚举再复制：Get-ChildItem -Recurse 是流式的，直接管道复制会把已落入
          # MSIX_DIR 的产物再次枚举到并“自己覆盖自己”报错
          $msixFiles = @(Get-ChildItem -Path . -Recurse -Filter *.msix -File)
          foreach ($f in $msixFiles) { Copy-Item $f.FullName -Destination "$env:MSIX_DIR" -Force }
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$env:RUNNER_TEMP\MemeManager-sign.pfx", $env:MSIX_PFX_PASSWORD)
          [IO.File]::WriteAllBytes("$env:MSIX_DIR\MemeManager-sign.cer", $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
        env:
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}

      - name: Upload msix artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemeManager-win-x64-msix-sideload
          path: ${{ env.MSIX_DIR }}

  # MSIX 打包·Store 轨：未签名（Store 认证通过后会用微软证书重新签名，无需自签名证书）
  pack-msix-store:
    runs-on: windows-latest
    env:
      MSIX_DIR: ${{ github.workspace }}\msix-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute AppxPackageVersion (v1.2.3 -> 1.2.3.0)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if (($ver -split '\.').Count -lt 4) { $ver += '.0' }
          "APPX_VERSION=$ver" >> $env:GITHUB_ENV

      # 覆盖 Package.appxmanifest 的 Identity Version 为 tag 版本：
      # 本打包链路（Microsoft.Windows.SDK.BuildTools.MSIX NuGet targets）不消费 AppxPackageVersion，
      # msix 文件名与包版本均取自 manifest 的 Identity Version（源文件写死 1.0.0.0）。
      # 正则只匹配 <Identity> 标签，避免误伤 MinVersion 等其它 Version 属性；替换失败直接抛错。
      - name: Set manifest Identity Version
        shell: pwsh
        run: |
          $manifest = 'MemeManager\Package.appxmanifest'
          $content = Get-Content $manifest -Raw
          $new = $content -replace '(<Identity[^>]*?Version=")[^"]*(")', "`${1}$env:APPX_VERSION`${2}"
          if ($new -eq $content) { throw "未找到 Package.appxmanifest 的 Identity Version，替换失败" }
          Set-Content -Path $manifest -Value $new -NoNewline -Encoding utf8BOM
          Write-Host "已设置 manifest Identity Version = $env:APPX_VERSION"

      - name: Publish unsigned MSIX (Store)
        shell: pwsh
        run: dotnet publish ./MemeManager/MemeManager.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64-msix -p:SelfContained=false -p:AppVersion=${{ github.ref_name }} -p:AppxPackageVersion=$env:APPX_VERSION -p:AppxPackageSigningEnabled=false

      - name: Collect msix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:MSIX_DIR" | Out-Null
          $msixFiles = @(Get-ChildItem -Path . -Recurse -Filter *.msix -File)
          foreach ($f in $msixFiles) { Copy-Item $f.FullName -Destination "$env:MSIX_DIR" -Force }

      - name: Upload msix artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemeManager-win-x64-msix-store
          path: ${{ env.MSIX_DIR }}
